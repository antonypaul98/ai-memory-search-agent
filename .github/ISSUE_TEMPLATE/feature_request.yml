name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user or engineering problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version first.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing features, simpler approaches, or external tools that may already solve it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture / extension
        - Connector / ingest
        - Retrieval / AHME
        - Ask / RAG
        - Memory intelligence
        - Knowledge graph
        - PWA / UI
        - Privacy / security
        - Performance / cost
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: How would we know this improvement actually helps?
