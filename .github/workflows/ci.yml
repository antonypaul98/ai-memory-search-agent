# V1-9 — CI (P-05): run the test suite on every push / PR.
name: CI

on:
  push:
    branches: [main, "cursor/**", "codex/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: memory_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memory_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify VERSION ↔ extension manifest
        run: |
          set -euo pipefail
          VER="$(tr -d '[:space:]' < VERSION)"
          MANIFEST_VER="$(python -c "import json; print(json.load(open('extension/manifest.json'))['version'])")"
          test "$VER" = "$MANIFEST_VER"

      - name: Extension helper tests
        run: node --test tests/extension/*.mjs

      - name: pytest -q
        env:
          AUTH_ENABLED: "false"
          LOCAL_DEMO_MODE: "true"
          RATE_LIMIT_ENABLED: "false"
          JOBS_ENABLED: "false"
          PWA_ENABLED: "true"
          MEMORY_AGENT_TEST_POSTGRES_DSN: "postgresql://postgres:postgres@127.0.0.1:5432/memory_agent_test"
        run: pytest -q

      - name: AHME benchmark smoke
        env:
          AUTH_ENABLED: "false"
          LOCAL_DEMO_MODE: "true"
          RATE_LIMIT_ENABLED: "false"
          JOBS_ENABLED: "false"
          PWA_ENABLED: "true"
          BENCHMARK_RUNS: "1"
        run: python scripts/benchmark_ahme.py
