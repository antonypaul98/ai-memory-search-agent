name: Home vision smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/services/home_agent/**'
      - 'app/db/postgres_home*'
      - 'requirements-home-vision.txt'
      - 'scripts/home_vision_smoke.py'
      - '.github/workflows/home-vision-smoke.yml'
permissions:
  contents: read
jobs:
  trained-vision-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: home_vision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d home_vision_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-home-vision.txt
      - name: Install vision dependencies
        run: python -m pip install -r requirements-home-vision.txt
      - name: Trained image detection, persistence and last-seen retrieval
        env:
          MEMORY_AGENT_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/home_vision_test
        run: python scripts/home_vision_smoke.py
