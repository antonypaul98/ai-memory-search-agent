# Dedicated isolated recording; does not change the core CI suites.
name: Memory Agent browser demo and recording

on:
  push:
    branches:
      - codex/demo-e2e-recording
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-browser-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-real-browser:
    name: Real Chromium UI test and video
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUTH_ENABLED: "false"
      LOCAL_DEMO_MODE: "true"
      RATE_LIMIT_ENABLED: "false"
      JOBS_ENABLED: "false"
      PWA_ENABLED: "true"
      HIERARCHICAL_RETRIEVAL_ENABLED: "false"
      LLM_PROVIDER: "none"
      MEMORY_AGENT_DEMO_E2E: "1"
      SQLITE_PATH: ${{ runner.temp }}/memory-agent-demo-e2e/videos.db
      CHROMA_PERSIST_DIR: ${{ runner.temp }}/memory-agent-demo-e2e/chroma
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium

      - name: Seed real embedded synthetic fixtures
        run: |
          mkdir -p artifacts/browser-demo
          python scripts/seed_browser_demo.py

      - name: Start isolated Memory Agent
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > artifacts/browser-demo/server.log 2>&1 &
          echo $! > artifacts/browser-demo/server.pid

      - name: Exercise and record Chromium UI
        run: python scripts/record_browser_demo.py

      - name: Preserve video, screenshots, results, and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-agent-real-browser-demo-${{ github.run_id }}
          path: |
            artifacts/browser-demo/memory-agent-browser-demo.webm
            artifacts/browser-demo/screenshots/
            artifacts/browser-demo/results.json
            artifacts/browser-demo/RESULTS.md
            artifacts/browser-demo/server.log
          if-no-files-found: warn
          retention-days: 14
