<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AI Memory Agent social preview</title>
  <desc id="desc">Search everything you saved: YouTube, web, PDFs, GitHub repositories, and bookmarks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#bg)"/>

  <circle cx="1080" cy="118" r="175" fill="#67e8f9" opacity="0.06"/>
  <circle cx="1130" cy="520" r="250" fill="#a78bfa" opacity="0.06"/>

  <g transform="translate(74 76)">
    <rect x="0" y="0" width="182" height="42" rx="21" fill="#20263a" stroke="#3a425c"/>
    <text x="91" y="27" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#dbeafe">OPEN SOURCE · MIT</text>
  </g>

  <g transform="translate(74 158)">
    <text font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="800" fill="#f8fafc">
      <tspan x="0" y="0">AI Memory Agent</tspan>
    </text>
    <text font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="650" fill="url(#accent)">
      <tspan x="0" y="64">Search everything you saved.</tspan>
    </text>
    <text font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="500" fill="#cbd5e1">
      <tspan x="0" y="120">Even when you forgot the title, source, or exact words.</tspan>
    </text>
  </g>

  <g transform="translate(74 356)" filter="url(#shadow)">
    <rect width="715" height="136" rx="26" fill="#111827" stroke="#334155"/>
    <text x="30" y="43" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21" fill="#94a3b8">You remember:</text>
    <text x="30" y="81" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="650" fill="#f8fafc">“that video about agent retries and tool failures”</text>
    <text x="30" y="116" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" fill="#67e8f9">→ hybrid retrieval → correct source → cited answer</text>
  </g>

  <g transform="translate(846 228)">
    <rect width="354" height="264" rx="30" fill="#111827" stroke="#334155"/>
    <text x="28" y="48" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">ONE SEARCH LAYER</text>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#dbeafe">
      <text x="30" y="94">▶ YouTube</text>
      <text x="30" y="130">◫ Web pages</text>
      <text x="30" y="166">▤ PDFs</text>
      <text x="30" y="202">⌘ GitHub repos</text>
      <text x="30" y="238">★ Bookmarks</text>
    </g>
  </g>

  <g transform="translate(74 560)">
    <text font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#94a3b8">Self-hosted · AHME · Dense + FTS5 · RRF · MMR · Grounded citations</text>
    <text x="1128" y="0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="19" fill="#cbd5e1">github.com/antonypaul98/ai-memory-search-agent</text>
  </g>
</svg>
